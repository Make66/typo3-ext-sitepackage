# /etc/nginx/snippets/typo3-common.conf
# Shared TYPO3 v14 hardening/rewrite rules — included by every per-domain vhost.
# Per-domain files must set (all BEFORE the `include`):
#   root, ssl_certificate(_key), access_log/error_log, and
#   set $php_upstream unix:/run/php/php8.5-fpm.sock;

index index.php;
client_max_body_size 25M;

# ----------------------------------------------------------------
# TLS (cert paths themselves stay in the per-domain file)
# ----------------------------------------------------------------
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_stapling        on;
ssl_stapling_verify on;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ----------------------------------------------------------------
# Security headers
# ----------------------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "interest-cohort=()" always;
add_header X-XSS-Protection "1; mode=block" always;

# ----------------------------------------------------------------
# Gzip
# ----------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# ----------------------------------------------------------------
# Block sensitive TYPO3 paths
# ----------------------------------------------------------------
location ~* /\. {
    deny all;
    return 403;
}

location ~* ^/(var|Build|vendor|node_modules)/ {
    deny all;
    return 403;
}

location ~* ^/typo3conf/LocalConfiguration\.php {
    deny all;
    return 403;
}

location ~* ^/typo3conf/AdditionalConfiguration\.php {
    deny all;
    return 403;
}

location ~* ^/fileadmin/_temp_/ {
    deny all;
    return 403;
}

location ~* ^/(fileadmin|uploads)/.*\.php$ {
    deny all;
    return 403;
}

# ----------------------------------------------------------------
# Backend / Install Tool
# ----------------------------------------------------------------
location ^~ /typo3/install {
    # allow 192.168.1.0/24;
    # deny all;
    try_files $uri $uri/ /index.php$is_args$args;
}

# ----------------------------------------------------------------
# Static asset caching
# ----------------------------------------------------------------
# Editor-mutable content (fileadmin uploads + their _processed_ thumbnails)                                              
# keeps the same filename after a "Replace" in Filelist, so it must
# revalidate on every request instead of being cached for a year like                                                                                      # the immutable, hash-named build assets below.   

location ~* ^/fileadmin/.*\.(png|jpe?g|gif|webp|avif)$ {
  expires 1h;
  add_header Cache-Control "public, must-revalidate";
  access_log off;
  try_files $uri =404;
}

location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|webp|avif)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  access_log off;
  try_files $uri =404;
}

location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
  expires 1y;
  add_header Cache-Control "public";
  access_log off;
  try_files $uri =404;
}

location ^~ /_assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# ----------------------------------------------------------------
# Front controller
# ----------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# ----------------------------------------------------------------
# PHP-FPM
# ----------------------------------------------------------------
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    fastcgi_pass $php_upstream;
    fastcgi_index index.php;
    fastcgi_read_timeout 300;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}
