categories:
  sitepackage:
    label: 'Sitepackage'
  sitepackage.a11y:
    label: 'Barrierefreiheit'
    parent: sitepackage
  sitepackage.typo:
    label: 'Typografie'
    parent: sitepackage
  sitepackage.navigation:
    label: 'Navigation'
    parent: sitepackage
  sitepackage.breadcrumb:
    label: 'Breadcrumb'
    parent: sitepackage
  sitepackage.cards:
    label: 'Cards'
    parent: sitepackage
  sitepackage.footer:
    label: 'Footer'
    parent: sitepackage
  sitepackage.calendarize:
    label: 'Kalender (calendarize)'
    parent: sitepackage
  sitepackage.routing:
    label: 'Sprechende URLs (Route Enhancer)'
    parent: sitepackage

settings:
  sitepackage.a11y.enable:
    category: sitepackage.a11y
    label: 'Barrierefreiheits-Leiste aktivieren'
    description: 'Renders the a11y toolbar (DropIn PageBefore) and loads its JS/CSS. See Documentation/A11yToolbar.md.'
    default: false
    type: bool
  sitepackage.a11y.statementPid:
    category: sitepackage.a11y
    label: 'Seite "Erklärung zur Barrierefreiheit"'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.easyLanguagePid:
    category: sitepackage.a11y
    label: 'Seite "Leichte Sprache"'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.contactPid:
    category: sitepackage.a11y
    label: 'Kontaktseite'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.searchPid:
    category: sitepackage.a11y
    label: 'Suchseite'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.position:
    category: sitepackage.a11y
    label: 'Position der Leiste'
    description: 'top = oben rechts über dem Header; right = vertikal am rechten Rand (Desktop), mobil wie top.'
    default: 'top'
    type: string
    enum:
      top: 'Toolbar: oben rechts'
      right: 'Toolbar: vertikal rechts'
  plugin.bootstrap_package.settings.scss.a11y-item-bg:
    category: sitepackage.a11y
    label: '$a11y-item-bg'
    description: 'Background of the toolbar boxes (search, contact, toggle).'
    default: '#e9ecef'
    type: string
  mandant:
    category: sitepackage
    label: 'Mandant folder name'
    description: 'Selects fileadmin/templates/<mandant>/ for this site''s theme.scss/custom.scss.'
    default: ''
    type: string
  layout:
    category: sitepackage
    label: 'Layout'
    description: 'Select one of the Base Layouts for this site'
    default: 'pl0'
    type: string
    enum:
      pl0: 'Mainz'
      pl1: 'Budenheim'
      pl2: 'Gonsenheim'
      pl3: 'Hechtsheim'
  page.theme.mainnavigation.levels:
    category: sitepackage
    label: 'Main navigation levels'
    description: 'Page tree depth fetched for the main navigation (navbar + dropdown/mega menu). bk2k/bootstrap-package hardcodes this to 3; overridden here (setup.typoscript, page.10.dataProcessing.10.levels) so it can be changed per site.'
    default: 3
    type: int
  plugin.bootstrap_package.settings.scss.font-body-key:
    category: sitepackage.typo
    label: 'Schrift Fließtext'
    description: 'Schriften aus Resources/Public/Scss/Fonts/_font-library.scss. See Documentation/Fonts.md.'
    default: 'system'
    type: string
    enum:
      system: 'Systemschrift (Arial)'
      overpass: 'Overpass'
      merriweathersans: 'Merriweather Sans'
      merriweather: 'Merriweather (Serif)'
      sourcesans3: 'Source Sans 3'
      roboto: 'Roboto'
      robotocondensed: 'Roboto Condensed'
      urbanist: 'Urbanist'
      opensans: 'Open Sans'
      montserrat: 'Montserrat'
      notosans: 'Noto Sans'
  plugin.bootstrap_package.settings.scss.font-heading-key:
    category: sitepackage.typo
    label: 'Schrift Überschriften'
    default: 'body'
    type: string
    enum:
      body: 'Wie Fließtext'
      system: 'Systemschrift (Arial)'
      overpass: 'Overpass'
      merriweathersans: 'Merriweather Sans'
      merriweather: 'Merriweather (Serif)'
      sourcesans3: 'Source Sans 3'
      roboto: 'Roboto'
      robotocondensed: 'Roboto Condensed'
      urbanist: 'Urbanist'
      opensans: 'Open Sans'
      montserrat: 'Montserrat'
      notosans: 'Noto Sans'
  plugin.bootstrap_package.settings.scss.font-weight-body:
    category: sitepackage.typo
    label: 'Schriftschnitt Fließtext'
    default: '400'
    type: string
    enum:
      '300': 'Light (300)'
      '400': 'Regular (400)'
  plugin.bootstrap_package.settings.scss.heading-font-weight:
    category: sitepackage.typo
    label: 'Schriftschnitt Überschriften h3, h5, h6'
    description: 'Fehlt der Schnitt in der gewählten Schrift, wird der nächstliegende verwendet.'
    default: '500'
    type: string
    enum: &heading-weights
      '300': 'Light (300)'
      '400': 'Regular (400)'
      '500': 'Medium (500)'
      '600': 'SemiBold (600)'
      '700': 'Bold (700)'
      '800': 'ExtraBold (800)'
  plugin.bootstrap_package.settings.scss.heading-font-weight-bold:
    category: sitepackage.typo
    label: 'Schriftschnitt Überschriften h1, h2, h4'
    description: 'Fehlt der Schnitt in der gewählten Schrift, wird der nächstliegende verwendet.'
    default: '500'
    type: string
    enum: *heading-weights
  plugin.bootstrap_package.settings.scss.font-size-base:
    category: sitepackage.typo
    label: 'Schriftgröße Fließtext'
    default: '1rem'
    type: string
    enum:
      '1rem': 'Normal (16px)'
      '1.0625rem': 'Etwas größer (17px)'
      '1.15rem': 'Mittel (18,4px)'
      '1.2rem': 'Groß (19,2px)'
      '1.25rem': 'Sehr groß (20px)'
  plugin.bootstrap_package.settings.scss.heading-scale:
    category: sitepackage.typo
    label: 'Größe der Überschriften'
    description: 'Desktop-Größe; kleinere Bildschirme skalieren fließend (RFS). Werte: $heading-scales in Theme/_layout-variables.scss.'
    default: 'normal'
    type: string
    enum:
      compact: 'Kompakt (h1 2rem)'
      normal: 'Normal (h1 2,2rem)'
      large: 'Groß (h1 2,5rem)'
  plugin.bootstrap_package.settings.scss.navbar-font-color:
    category: sitepackage.navigation
    label: 'Navigation Schriftfarbe'
    default: '#333'
    type: color
  plugin.bootstrap_package.settings.scss.navbar-active-color:
    category: sitepackage.navigation
    label: 'Navigation Hover-/Aktiv-Farbe'
    description: 'Hex-Wert, z. B. #2b9a4b. Leer = Primärfarbe.'
    default: ''
    type: string
  plugin.bootstrap_package.settings.scss.breadcrumb-section-bg:
    category: sitepackage.breadcrumb
    label: 'Breadcrumb Hintergrund'
    default: '#f1f1f1'
    type: color
  plugin.bootstrap_package.settings.scss.card-radius:
    category: sitepackage.cards
    label: 'Cards Eckenradius'
    default: '.75rem'
    type: string
    enum:
      '0': 'Eckig'
      '.25rem': 'Klein (4px)'
      '.5rem': 'Mittel (8px)'
      '.75rem': 'Rund (12px)'
      '1rem': 'Sehr rund (16px)'
  plugin.bootstrap_package.settings.scss.page-footer-background:
    category: sitepackage.footer
    label: 'Footer Hintergrundfarbe'
    default: '#5b5b5b'
    type: color
  plugin.bootstrap_package.settings.scss.page-footer-color:
    category: sitepackage.footer
    label: 'Footer Schriftfarbe'
    default: '#fff'
    type: color
  plugin.bootstrap_package.settings.scss.page-footer-color-header:
    category: sitepackage.footer
    label: 'Footer Überschriftenfarbe'
    default: '#fff'
    type: color
  sitepackage.calendarize.monthCategoryFilter:
    category: sitepackage.calendarize
    label: 'Kategorie-Filter in der Monatsansicht'
    description: 'Shows category filter links above the calendarize month view. See Documentation/Calendarize.md.'
    default: true
    type: bool
  sitepackage.routing.calendarizePages:
    category: sitepackage.routing
    label: 'Seiten mit Kalender-URLs (calendarize)'
    description: 'Page uids where Configuration/Routes/Calendarize.yaml is active, in addition to pages with "Contains plugin" = Calendarize. See Documentation/RouteEnhancers.md.'
    default: []
    type: stringlist
  sitepackage.routing.newsPages:
    category: sitepackage.routing
    label: 'Seiten mit News-URLs'
    description: 'Page uids where Configuration/Routes/News.yaml is active, in addition to pages with "Contains plugin" = news plugins. See Documentation/RouteEnhancers.md.'
    default: []
    type: stringlist
  sitepackage.routing.contactPages:
    category: sitepackage.routing
    label: 'Seiten mit Ansprechpartner-URLs'
    description: 'Page uids where Configuration/Routes/Contact.yaml is active, in addition to pages with "Contains plugin" = Sitepackage: Ansprechpartner. See Documentation/RouteEnhancers.md.'
    default: []
    type: stringlist
