categories:
  sitepackage:
    label: 'Sitepackage'
  sitepackage.a11y:
    label: 'Barrierefreiheit'
    parent: sitepackage

settings:
  sitepackage.a11y.enable:
    category: sitepackage.a11y
    label: 'Barrierefreiheits-Leiste aktivieren'
    description: 'Renders the a11y toolbar (DropIn PageBefore) and loads its JS/CSS. See Documentation/A11yToolbar.md.'
    default: false
    type: bool
  sitepackage.a11y.statementPid:
    category: sitepackage.a11y
    label: 'Seite "Erklärung zur Barrierefreiheit"'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.easyLanguagePid:
    category: sitepackage.a11y
    label: 'Seite "Leichte Sprache"'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.contactPid:
    category: sitepackage.a11y
    label: 'Kontaktseite'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  sitepackage.a11y.searchPid:
    category: sitepackage.a11y
    label: 'Suchseite'
    description: 'Page uid; 0 hides the link.'
    default: 0
    type: int
  plugin.bootstrap_package.settings.scss.a11y-item-bg:
    category: sitepackage.a11y
    label: '$a11y-item-bg'
    description: 'Background of the toolbar boxes (search, contact, toggle).'
    default: '#e9ecef'
    type: string
  mandant:
    category: sitepackage
    label: 'Mandant folder name'
    description: 'Selects fileadmin/templates/<mandant>/ for this site''s theme.scss/custom.scss.'
    default: ''
    type: string
  layout:
    category: sitepackage
    label: 'Layout'
    description: 'Select one of the Base Layouts for this site'
    default: 'pl0'
    type: string
    enum:
      pl0: 'Mainz'
      pl1: 'Budenheim'
      pl2: 'Gonsenheim'
      pl3: 'Hechtsheim'
  page.theme.mainnavigation.levels:
    category: sitepackage
    label: 'Main navigation levels'
    description: 'Page tree depth fetched for the main navigation (navbar + dropdown/mega menu). bk2k/bootstrap-package hardcodes this to 3; overridden here (setup.typoscript, page.10.dataProcessing.10.levels) so it can be changed per site.'
    default: 3
    type: int
