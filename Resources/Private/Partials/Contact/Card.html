<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<div class="sitepackage-contact-card card h-100">
    <f:if condition="{contact.photo}">
        <f:for each="{contact.photo}" as="image" iteration="iterator">
            <f:if condition="{iterator.isFirst}">
                <f:image image="{image}" class="card-img-top" alt="{contact.firstName} {contact.lastName}" />
            </f:if>
        </f:for>
    </f:if>
    <div class="card-body">
        <h3 class="card-title h6">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <f:if condition="{displayItems.salutation}">{contact.salutation} </f:if>{contact.firstName} {contact.lastName}
        </h3>
        <f:if condition="{displayItems.position} && {contact.jobPosition}">
            <p class="mb-1 d-flex align-items-start gap-2"><i class="fa-solid fa-id-badge" aria-hidden="true"></i><span>{contact.jobPosition}</span></p>
        </f:if>
        <f:if condition="{displayItems.department} && {contact.departmentText}">
            <p class="text-body-secondary mb-1 d-flex align-items-start gap-2"><i class="fa-solid fa-people-group" aria-hidden="true"></i><span>{contact.departmentText}</span></p>
        </f:if>
        <f:if condition="{displayItems.room} && {contact.room}">
            <p class="text-body-secondary mb-1 d-flex align-items-start gap-2"><i class="fa-solid fa-door-open" aria-hidden="true"></i><span>{contact.room}</span></p>
        </f:if>
        <f:render partial="Contact/CommunicationsList" arguments="{contact: contact, displayItems: displayItems}" />
        <f:if condition="{singleViewPage}">
            <p class="mt-2 mb-0">
                <f:link.action action="show" pageUid="{singleViewPage}" arguments="{contact: contact.uid}" class="stretched-link">
                    <f:translate key="action.showDetail" extensionName="sitepackage">Details</f:translate>
                </f:link.action>
            </p>
        </f:if>
    </div>
</div>
</html>
