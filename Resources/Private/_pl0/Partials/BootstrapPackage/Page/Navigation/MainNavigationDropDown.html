<f:render section="dropdown" arguments="{data: data, items: items, theme: theme, level: 2}" />

<f:section name="dropdown">
    <f:if condition="{items}">
        <f:variable name="currentLevel">{level}</f:variable>
        <ul class="dropdown-nav" data-level="{level}">
            <f:variable name="level">{level + 1}</f:variable>
            <f:for each="{items}" as="item">
                <f:if condition="{item.spacer}">
                    <f:then>
                        <li class="nav-spacer" aria-hidden="true"></li>
                    </f:then>
                    <f:else>
                        <f:variable name="hasSubnavToggle">0</f:variable>
                        <f:if condition="{currentLevel} == 2 && {item.children}">
                            <f:variable name="hasSubnavToggle">1</f:variable>
                        </f:if>
                        <li class="nav-item{f:if(condition: hasSubnavToggle, then: ' nav-item-has-subnav-toggle')}">
                            <a class="nav-link nav-link-dropdown{f:if(condition: item.active, then:' active')}" href="{item.link}"{f:if(condition: '{item.target}', then: ' target="{item.target}"')}{f:if(condition: '{item.target} == "_blank"', then: ' rel="noopener noreferrer"')} title="{item.title}">
                                <f:if condition="{theme.navigation.dropdown.icon.enable} && {item.icon}">
                                    <span class="nav-link-icon">
                                        <bk2k:icon icon="{item.icon}" width="{theme.navigation.dropdown.icon.width}" height="{theme.navigation.dropdown.icon.height}" />
                                    </span>
                                </f:if>
                                <span class="nav-link-text">
                                    {item.title}
                                    <f:if condition="{item.current}"> <span class="visually-hidden">({f:translate(key: 'navigation.link.screenreader.current', extensionName: 'bootstrap_package')})</span></f:if>
                                </span>
                            </a>
                            <f:if condition="{hasSubnavToggle}">
                                <f:then>
                                    <button
                                        type="button"
                                        class="nav-link nav-link-toggle"
                                        data-bs-toggle="collapse"
                                        data-bs-target="#nav-subnav-{item.data.uid}"
                                        aria-expanded="{f:if(condition: item.active, then: 'true', else: 'false')}"
                                        aria-controls="nav-subnav-{item.data.uid}"
                                        >
                                        <span class="nav-link-indicator" aria-hidden="true"></span>
                                        <span class="visually-hidden">Untermenü von „{item.title}“ ein-/ausblenden</span>
                                    </button>
                                    <div class="collapse{f:if(condition: item.active, then: ' show')}" id="nav-subnav-{item.data.uid}">
                                        <f:render section="dropdown" arguments="{data: data, items: item.children, theme: theme, level: level}" />
                                    </div>
                                </f:then>
                                <f:else>
                                    <f:render section="dropdown" arguments="{data: data, items: item.children, theme: theme, level: level}" />
                                </f:else>
                            </f:if>
                        </li>
                    </f:else>
                </f:if>
            </f:for>
        </ul>
    </f:if>
</f:section>
