<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
	 xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
	 xmlns:c="http://typo3.org/ns/HDNET/Calendarize/ViewHelpers">

	<f:comment><!-- Override of EXT:calendarize: adds the category filter and category colors (Documentation/Calendarize.md) --></f:comment>
	<f:layout name="Default" />

	<f:section name="Main">
		<f:if condition="{settings.monthCategoryFilter} && {extended.categories}">
			<f:render partial="MonthCategoryFilter" arguments="{date:date, categories:extended.categories, categoryFilter:extended.categoryFilter, categoryColors:extended.categoryColors, contentObject:contentObject}" />
		</f:if>
		<f:render partial="Month" arguments="{date:date,indices:indices,contentObject:contentObject, ignoreSelectedDay:ignoreSelectedDay, pagination: pagination, categoryFilter: extended.categoryFilter, categoryColors: extended.categoryColors}" />
	</f:section>
</div>
